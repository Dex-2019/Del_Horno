<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panadería Del Horno — Panel</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-stamp">DH</div>
      <div class="name">Del Horno<small>Panel de gestión</small></div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-item" data-view="dashboard"><span class="nav-icon">◆</span> Dashboard</div>
      <div class="nav-item" data-view="jornada"><span class="nav-icon">☀</span> Jornada del día</div>
      <div class="nav-item" data-view="rutas"><span class="nav-icon">➜</span> Rutas</div>
      <div class="nav-item" data-view="productos"><span class="nav-icon">▤</span> Productos</div>
      <div class="nav-item" data-view="inventario"><span class="nav-icon">▧</span> Inventario</div>
      <div class="nav-item" data-view="ventas"><span class="nav-icon">L</span> Ventas</div>
      <div class="nav-item" data-view="gastos"><span class="nav-icon">−</span> Gastos</div>
      <div class="nav-item" data-view="vehiculo"><span class="nav-icon">◈</span> Vehículo</div>
      <div class="nav-item" data-view="depositos"><span class="nav-icon">▣</span> Depósitos</div>
      <div class="nav-item" data-view="reportes"><span class="nav-icon">▦</span> Reportes</div>
      <div class="nav-item" data-view="usuarios" id="nav-usuarios"><span class="nav-icon">⚿</span> Usuarios</div>
    </nav>

    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">–</div>
        <div class="user-meta">
          <div class="u-name" id="user-name">—</div>
          <div class="u-role" id="user-role">—</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-block btn-sm" id="logout-btn">Cerrar sesión</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <div>
          <h2 id="view-title">Dashboard</h2>
          <div class="sub" id="view-sub"></div>
        </div>
      </div>
    </div>

    <div id="readonly-banner-slot"></div>
    <div id="view-root">
      <div class="empty-state"><p>Cargando…</p></div>
    </div>
  </main>

</div>

<div class="modal-overlay" id="modal-overlay"></div>
<div id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
