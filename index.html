<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panadería Del Horno — Iniciar sesión</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="login-stamp">DH</div>
    <h1>Panadería Del Horno</h1>
    <p class="login-sub">Sistema de gestión — inicia sesión para continuar</p>

    <div class="login-error" id="login-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required autocomplete="username" placeholder="admin@delhorno.com">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-block" id="login-btn">Iniciar sesión</button>
    </form>
  </div>
</div>

<script type="module">
  import { login, onAuthReady } from "./js/auth.js";

  const form = document.getElementById("login-form");
  const errBox = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");

  // Si ya hay sesión activa, ir directo a la app.
  onAuthReady((user) => {
    if (user) window.location.href = "app.html";
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errBox.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Ingresando…";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      await login(email, password);
      window.location.href = "app.html";
    } catch (err) {
      errBox.textContent = "Correo o contraseña incorrectos.";
      errBox.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Iniciar sesión";
    }
  });
</script>
</body>
</html>
